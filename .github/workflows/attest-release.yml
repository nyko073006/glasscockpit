name: Release-Dateien attestieren
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, dessen Dateien attestiert werden
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Release-Dateien laden
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Attestieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
